<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Maandrapportage - ZorgInzicht</title>
  <link rel="stylesheet" href="app.css" />
</head>

<body>

<main class="container">

  <header class="topbar">
    <div>
      <h1>Maandrapportage</h1>
      <p>Overzicht voor jou en je boekhouder</p>
    </div>

    <button onclick="window.location.href='facturen.html'" class="btn">
      Terug
    </button>
  </header>

  <!-- MAAND -->
  <section class="card">
    <div class="form-row">
      <div>
        <label>Kies maand</label>
        <input type="month" id="monthPicker">
      </div>

      <div>
  <label>Status</label>

  <select id="statusFilter">
    <option value="all">Alles</option>
    <option value="betaald">Betaald</option>
    <option value="herinnering">Herinnering</option>
    <option value="klaar">Openstaand</option>
  </select>
</div>

      <button id="btnLoadReport" class="btn primary">
        Rapportage laden
      </button>
    </div>
  </section>

  <!-- STATS -->
  <section class="stats">
    <div class="card">
      <h3>Omzet</h3>
      <span id="totalRevenue">€0</span>
    </div>

    <div class="card green">
      <h3>Betaald</h3>
      <span id="paidTotal">€0</span>
    </div>

    <div class="card orange">
      <h3>Openstaand</h3>
      <span id="openTotal">€0</span>
    </div>

    <div class="card red">
      <h3>Herinnering</h3>
      <span id="reminderTotal">€0</span>
    </div>
  </section>

  <!-- TABEL -->
  <section class="card">
    <h2>Facturen overzicht</h2>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Nr</th>
            <th>Datum</th>
            <th>Cliënt</th>
            <th>Status</th>
            <th>Werk</th>
            <th>Km</th>
            <th>Materiaal</th>
            <th>Parkeren</th>
            <th>Totaal</th>
          </tr>
        </thead>
        <tbody id="reportBody">
          <tr>
            <td colspan="9">Nog geen data geladen</td>
          </tr>
        </tbody>
      </table>
    </div>

    <div class="actions">
      <button id="btnDownloadCsv" class="btn primary">
        Download voor boekhouder
      </button>

      <button id="btnPrint" class="btn">
        Print / PDF
      </button>
    </div>
  </section>

</main>

<!-- BELANGRIJK -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="maandrapportage-facturen.js"></script>

</body>
</html>
