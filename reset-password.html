<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ZorgRapp - Nieuw wachtwoord</title>

  <style>
    :root {
      --bg: #f7f8fa;
      --card: #ffffff;
      --text: #1e2430;
      --muted: #6b7280;
      --line: #e5e7eb;
      --dark: #111827;
      --shadow: 0 12px 30px rgba(15, 23, 42, 0.06);
      --radius: 18px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }

    .card {
      width: 100%;
      max-width: 480px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 30px;
    }

    h1 {
      margin: 0 0 10px;
      font-size: 34px;
    }

    p {
      margin: 0 0 24px;
      color: var(--muted);
      line-height: 1.5;
    }

    .field {
      margin-bottom: 18px;
    }

    .label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      font-weight: 700;
    }

    .input {
      width: 100%;
      padding: 14px 16px;
      border: 1px solid var(--line);
      border-radius: 14px;
      font-size: 15px;
    }

    .btn {
      width: 100%;
      border: none;
      border-radius: 14px;
      padding: 14px 18px;
      font-size: 15px;
      font-weight: 700;
      background: var(--dark);
      color: white;
      cursor: pointer;
      margin-top: 8px;
    }

    .msg {
      margin-top: 14px;
      min-height: 20px;
      font-size: 14px;
      color: var(--muted);
    }
  </style>
</head>

<body>

  <div class="card">

    <h1>Nieuw wachtwoord</h1>

    <p>
      Kies hieronder een nieuw wachtwoord voor je ZorgRapp account.
    </p>

    <div class="field">
      <label class="label" for="newPassword">
        Nieuw wachtwoord
      </label>

      <input
        class="input"
        id="newPassword"
        type="password"
        placeholder="Nieuw wachtwoord"
      />
    </div>

    <button class="btn" id="savePasswordBtn" type="button">
      Wachtwoord opslaan
    </button>

    <div class="msg" id="msg"></div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./reset-password.js?v=2"></script>

</body>
</html>
