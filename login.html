<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ZorgRapp - Inloggen</title>
  <style>
    :root {
      --bg: #f7f8fa;
      --card: #ffffff;
      --text: #1e2430;
      --muted: #6b7280;
      --line: #e5e7eb;
      --dark: #111827;
      --shadow: 0 12px 30px rgba(15, 23, 42, 0.06);
      --radius: 18px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }

    .card {
      width: 100%;
      max-width: 480px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 30px;
    }

    h1 {
      margin: 0 0 10px;
      font-size: 40px;
    }

    p {
      margin: 0 0 24px;
      color: var(--muted);
    }

    .tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    .tab-btn {
      flex: 1;
      border: 1px solid var(--line);
      background: white;
      border-radius: 14px;
      padding: 12px 14px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }

    .tab-btn.active {
      background: var(--dark);
      color: white;
      border-color: var(--dark);
    }

    .field {
      margin-bottom: 16px;
    }

    .label {
      display: block;
      margin-bottom: 8px;
      font-weight: 700;
      font-size: 14px;
    }

    .input {
      width: 100%;
      padding: 14px 16px;
      border: 1px solid var(--line);
      border-radius: 14px;
      font-size: 15px;
    }

    .btn {
      width: 100%;
      border: none;
      border-radius: 14px;
      padding: 14px 18px;
      font-size: 15px;
      font-weight: 700;
      background: var(--dark);
      color: white;
      cursor: pointer;
      margin-top: 8px;
    }

    .msg {
      margin-top: 14px;
      min-height: 20px;
      font-size: 14px;
      color: var(--muted);
    }

    .hidden {
      display: none;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>ZorgRapp</h1>
    <p>Meer overzicht. Minder administratie.</p>

    <div class="tabs">
      <button class="tab-btn active" id="tabLogin" type="button">Inloggen</button>
      <button class="tab-btn" id="tabRegister" type="button">Registreren</button>
    </div>

    <div id="registerNameWrap" class="field hidden">
      <label class="label" for="fullName">Naam</label>
      <input class="input" id="fullName" type="text" placeholder="Bijvoorbeeld: Denise" />
    </div>

    <div class="field">
      <label class="label" for="email">E-mail</label>
      <input class="input" id="email" type="email" placeholder="naam@voorbeeld.nl" />
    </div>

    <div class="field">
      <label class="label" for="password">Wachtwoord</label>
      <input class="input" id="password" type="password" placeholder="Wachtwoord" />
    </div>

    <button class="btn" id="submitBtn">Inloggen</button>
    <div class="msg" id="msg"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./login.js"></script>
</body>
</html>
