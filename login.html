<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ZorgInzicht - Inloggen</title>
  <style>
    :root {
      --bg: #f7f8fa;
      --card: #ffffff;
      --text: #1e2430;
      --muted: #6b7280;
      --line: #e5e7eb;
      --dark: #111827;
      --shadow: 0 12px 30px rgba(15, 23, 42, 0.06);
      --radius: 18px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }

    .card {
      width: 100%;
      max-width: 460px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 28px;
    }

    h1 {
      margin: 0 0 10px;
      font-size: 38px;
    }

    p {
      margin: 0 0 22px;
      color: var(--muted);
    }

    .label {
      display: block;
      margin-bottom: 8px;
      font-weight: 700;
      font-size: 14px;
    }

    .input {
      width: 100%;
      padding: 14px 16px;
      border: 1px solid var(--line);
      border-radius: 14px;
      font-size: 15px;
      margin-bottom: 16px;
    }

    .btn {
      width: 100%;
      border: none;
      border-radius: 14px;
      padding: 14px 18px;
      font-size: 15px;
      font-weight: 700;
      background: var(--dark);
      color: white;
      cursor: pointer;
    }

    .msg {
      margin-top: 12px;
      min-height: 18px;
      font-size: 14px;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>ZorgInzicht</h1>
    <p>Meer overzicht. Minder administratie.</p>

    <label class="label" for="email">E-mail</label>
    <input class="input" id="email" type="email" placeholder="naam@voorbeeld.nl" />

    <label class="label" for="password">Wachtwoord</label>
    <input class="input" id="password" type="password" placeholder="Wachtwoord" />

    <button class="btn" id="loginBtn">Inloggen</button>
    <div class="msg" id="msg"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./login.js"></script>
</body>
</html>
