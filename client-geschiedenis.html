<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ZorgInzicht - Cliënt geschiedenis</title>
  <style>
    :root {
      --bg: #f7f8fa;
      --card: #ffffff;
      --text: #1e2430;
      --muted: #6b7280;
      --line: #e5e7eb;
      --soft: #f3f4f6;
      --dark: #111827;
      --shadow: 0 12px 30px rgba(15, 23, 42, 0.06);
      --radius: 18px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .container {
      max-width: 860px;
      margin: 0 auto;
      padding: 24px 16px 60px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 20px;
      margin-bottom: 20px;
    }

    .topbar h1 {
      margin: 0;
      font-size: 42px;
      font-weight: 800;
      line-height: 1;
    }

    .topbar p {
      margin: 10px 0 0;
      font-size: 16px;
      color: var(--muted);
    }

    .link-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 14px;
    }

    .page-link {
      display: inline-block;
      font-size: 14px;
      color: var(--muted);
      text-decoration: none;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 22px;
      margin-bottom: 18px;
      box-shadow: var(--shadow);
    }

    .section {
      padding: 18px 0 8px;
      border-top: 1px solid var(--line);
    }

    .section:first-of-type {
      border-top: none;
      padding-top: 0;
    }

    .section-title {
      margin: 0 0 16px;
      font-size: 22px;
      font-weight: 700;
    }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
    }

    .summary-box {
      background: #fbfbfc;
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 16px;
    }

    .summary-label {
      font-size: 14px;
      color: var(--muted);
      font-weight: 700;
      margin-bottom: 8px;
    }

    .summary-value {
      font-size: 18px;
      font-weight: 700;
    }

    .history-item {
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 18px;
      background: #fbfbfc;
      margin-bottom: 14px;
    }

    .history-title {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 10px;
    }

    .history-meta {
      color: var(--muted);
      font-size: 14px;
      margin-bottom: 12px;
      line-height: 1.5;
    }

    .history-block {
      margin-bottom: 10px;
      font-size: 15px;
      line-height: 1.5;
    }

    .history-block strong {
      display: inline-block;
      margin-bottom: 4px;
    }

    .status-pill {
      display: inline-block;
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 700;
      background: var(--soft);
      color: var(--text);
    }

    .empty-text {
      color: var(--muted);
      font-size: 15px;
    }

    .pdf-button {
      display: block;
      width: 100%;
      margin-top: 20px;
      padding: 16px 18px;
      border: none;
      border-radius: 14px;
      background: #0f172a;
      color: #ffffff;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    .pdf-button:hover {
      opacity: 0.96;
    }

    @media (max-width: 720px) {
      .topbar {
        flex-direction: column;
        align-items: flex-start;
      }

      .topbar h1 {
        font-size: 34px;
      }

      .summary-grid {
        grid-template-columns: 1fr;
      }
    }

    @media print {
      .link-group,
      #savePdfBtn {
        display: none !important;
      }

      body {
        background: #ffffff;
      }

      .card {
        box-shadow: none;
        border: 1px solid #ddd;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header class="topbar">
      <div>
        <h1 id="pageTitle">Cliënt geschiedenis</h1>
        <p>Overzicht van afspraken, signalen en notities van deze cliënt.</p>

        <div class="link-group">
          <a class="page-link" id="backToClientCard" href="./clientkaart.html">← Terug naar cliëntenkaart</a>
<a class="page-link" id="backToMonthReport" href="./maandrapportage-clienten.html">← Terug naar maandrapportage cliënten</a>
<a class="page-link" href="./today.html">← Terug naar dashboard</a>
        </div>
      </div>
    </header>

    <section class="card">
      <div class="section">
        <h2 class="section-title">Overzicht</h2>
        <div class="summary-grid">
          <div class="summary-box">
            <div class="summary-label">Aantal afspraken</div>
            <div class="summary-value" id="totalAppointments">-</div>
          </div>
          <div class="summary-box">
            <div class="summary-label">Totaal minuten</div>
            <div class="summary-value" id="totalMinutes">-</div>
          </div>
          <div class="summary-box">
            <div class="summary-label">Signalen totaal</div>
            <div class="summary-value" id="totalSignals">-</div>
          </div>
        </div>
      </div>

      <div class="section">
        <h2 class="section-title">Geschiedenis</h2>
        <div id="historyList" class="empty-text">Laden...</div>
      </div>

      <button type="button" class="pdf-button" id="savePdfBtn">Opslaan als PDF</button>
    </section>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./client-geschiedenis.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const clientId = params.get("id");
    const backToClientCard = document.getElementById("backToClientCard");
    const savePdfBtn = document.getElementById("savePdfBtn");

    if (backToClientCard && clientId) {
      backToClientCard.href = `./clientkaart.html?id=${clientId}`;
    }

    if (savePdfBtn) {
      savePdfBtn.addEventListener("click", () => {
        window.print();
      });
    }
  </script>
</body>
</html>
