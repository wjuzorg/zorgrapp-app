<script>
const SUPABASE_URL = "https://bqqoxawgjxxvolljkqnp.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJxcW94YXdnanh4dm9sbGprcW5wIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY0ODc0OTMsImV4cCI6MjA5MjA2MzQ5M30.WLTELxD32HFtyV1pbsB-60nF_k4Zq7DSvaR87-kj2es";

const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const params = new URLSearchParams(window.location.search);
const clientId = params.get("id");

document.getElementById("backToClientCard").href =
  `clientkaart.html?id=${clientId}`;

function formatDate(dateString) {
  if (!dateString) return "-";

  const date = new Date(dateString);

  return date.toLocaleDateString("nl-NL", {
    day: "numeric",
    month: "long",
    year: "numeric"
  });
}

function getSignalText(item) {
  const signals = [];

  if (item.risk_dropout) signals.push("Risico op uitval");
  if (item.needs_extra_support) signals.push("Extra ondersteuning nodig");
  if (item.hard_to_reach) signals.push("Moeilijk bereikbaar");
  if (item.observed_decline) signals.push("Achteruitgang opgemerkt");

  return signals.length ? signals.join(", ") : "-";
}

async function loadClientHistory() {
  const historyList = document.getElementById("historyList");

  if (!clientId) {
    historyList.innerHTML =
      `<div class="card">Geen ID gevonden.</div>`;
    return;
  }

  const { data, error } = await supabase
    .from("requests")
    .select("*")
    .eq("id", clientId);

  if (error) {
    console.error(error);
    historyList.innerHTML =
      `<div class="card">Fout bij laden van geschiedenis.</div>`;
    return;
  }

  if (!data || data.length === 0) {
    historyList.innerHTML =
      `<div class="card">Nog geen gegevens gevonden.</div>`;
    return;
  }

  const first = data[0];

  document.getElementById("clientName").textContent =
    first.full_name
      ? `Geschiedenis van ${first.full_name}`
      : "Cliënt geschiedenis";

  historyList.innerHTML = `
    <div class="card" style="margin-bottom:16px;">

      <div style="font-weight:700; font-size:18px; margin-bottom:8px;">
        ${first.service_type || "Afspraak"}
      </div>

      <div style="margin-bottom:8px;">
        <strong>Datum:</strong>
        ${formatDate(first.appointment_time || first.created_at)}
      </div>

      <div style="margin-bottom:8px;">
        <strong>Status:</strong>
        ${first.status || "-"}
      </div>

      <div style="margin-bottom:8px;">
        <strong>Duur:</strong>
        ${first.duration_minutes || 0} minuten
      </div>

      <div style="margin-bottom:8px;">
        <strong>Werk gedaan:</strong><br>
        ${first.work_done || "-"}
      </div>

      <div style="margin-bottom:8px;">
        <strong>Niet gelukt reden:</strong><br>
        ${first.not_done_reason || "-"}
      </div>

      <div style="margin-bottom:8px;">
        <strong>Signalen:</strong><br>
        ${getSignalText(first)}
      </div>

      <div style="margin-bottom:8px;">
        <strong>Interne notitie:</strong><br>
        ${first.internal_signal_notes || "-"}
      </div>

    </div>
  `;
}

loadClientHistory();
</script>
