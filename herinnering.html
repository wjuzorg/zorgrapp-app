<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Herinnering sturen</title>
<link rel="stylesheet" href="app.css?v=200">
</head>

<body>
<main class="container">

<header class="topbar">
<div>
<h1>Betalingsherinnering</h1>
<p>Controleer de factuur voor verzenden.</p>
</div>
</header>

<section class="form-card">

<h2>Dhr. Test</h2>
<p>Factuur #2026-0031</p>
<p><strong>Openstaand bedrag: €110,00</strong></p>

<label class="form-label">Bericht</label>

<textarea class="form-textarea" rows="12" id="reminderText">Beste heer/mevrouw,

Volgens onze administratie staat onderstaande factuur nog open.

Factuurnummer: #2026-0031
Openstaand bedrag: €110,00

Wellicht is deze factuur aan uw aandacht ontsnapt.

Wij verzoeken u vriendelijk het openstaande bedrag binnen 7 werkdagen alsnog te voldoen.

Heeft u de betaling inmiddels gedaan? Dan kunt u deze herinnering als niet verzonden beschouwen.

Met vriendelijke groet,

Naam ondernemer</textarea>

<div class="preview-actions">
  <button type="button" class="btn btn-primary" onclick="sendReminderByEmail()">
  Herinnering per mail verzenden
</button>

<button type="button" class="btn btn-secondary" onclick="sendReminderByPost()">
  Herinnering per post verzenden
</button>

  <button onclick="window.location.href='facturen.html'" class="light-btn">
    Terug
  </button>
</div>

</section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="herinnering.js?v=2"></script>

</body>
</html>
