<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZorgInzicht</title>
  <link rel="stylesheet" href="./app.css">
</head>
<body>

<div class="container">

  <header class="topbar">
    <div>
      <h1>ZorgInzicht</h1>
      <p>Meer overzicht. Minder administratie.</p>
    </div>
   <div class="profile-menu-wrap">
 <button class="userbox profile-trigger" id="btnUserProfile" type="button">
  Laden...
</button>

  <div class="profile-card hidden" id="profileDropdown">
    <div class="profile-card-label">Ingelogd als</div>
    <div class="profile-card-email" id="profileEmail">Laden...</div>

   <button onclick="window.location.href='bedrijfsprofiel.html'">
  Bedrijfsprofiel
</button>
    <button type="button" class="profile-card-item" id="menuPassword">Wachtwoord wijzigen</button>
    <button type="button" class="profile-card-item danger" id="menuLogout">Uitloggen</button>
  </div>
</div>
  </header>

 <section class="welcome">
  <h2 id="welcomeTitle">Goedemorgen</h2>
  <p id="welcomeText">Laden...</p>
</section>

<section class="stats">
  <div class="card dark" id="btnNewClient">
    <h3>Nieuwe cliënt</h3>
    <span>+</span>
  </div>

  <div class="card">
    <h3>Afspraken vandaag</h3>
    <span id="todayCount">0</span>
  </div>

  <div class="card orange">
    <h3>Actiesignalen</h3>
    <span id="signalCount">0</span>
  </div>

  <div class="card blue" onclick="window.location.href='./facturen.html'" style="cursor:pointer;">
    <h3>Facturen</h3>
    <span id="invoiceTotal">€0</span>
  </div>
</section>

<section class="today">
  <div style="display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:18px;">
    <h2 style="margin:0;">Vandaag</h2>
    <div class="userbox" id="todayDateLabel">Vandaag</div>
  </div>

  <div id="appointmentsList" class="empty-state">
    Afspraken laden...
  </div>
</section>

<section class="weekbar compact-weekbar">
  <div class="weekbar-header compact-weekbar-header">
    <h3>Weekplanning</h3>
    <div class="week-nav">
      <button class="week-nav-btn" id="prevWeekBtn" type="button">‹</button>
      <span id="weekRangeLabel">Week laden...</span>
      <button class="week-nav-btn" id="nextWeekBtn" type="button">›</button>
    </div>
  </div>

  <div class="weekdays compact-weekdays" id="weekdaysRow">
    <button class="weekday-card compact-day" data-day="0">
      <div class="weekday-name">Ma</div>
      <div class="weekday-count">0</div>
    </button>

    <button class="weekday-card compact-day" data-day="1">
      <div class="weekday-name">Di</div>
      <div class="weekday-count">0</div>
    </button>

    <button class="weekday-card compact-day" data-day="2">
      <div class="weekday-name">Wo</div>
      <div class="weekday-count">0</div>
    </button>

    <button class="weekday-card compact-day" data-day="3">
      <div class="weekday-name">Do</div>
      <div class="weekday-count">0</div>
    </button>

    <button class="weekday-card compact-day" data-day="4">
      <div class="weekday-name">Vr</div>
      <div class="weekday-count">0</div>
    </button>

    <button class="weekday-card compact-day" data-day="5">
      <div class="weekday-name">Za</div>
      <div class="weekday-count">0</div>
    </button>

    <button class="weekday-card compact-day" data-day="6">
      <div class="weekday-name">Zo</div>
      <div class="weekday-count">0</div>
    </button>
  </div>
</section>

<nav class="settings-nav">
  <button onclick="window.location.href='privacy.html'">
    Privacy
  </button>

  <button onclick="window.location.href='bedrijfsprofiel.html'">
    Bedrijfsprofiel
  </button>
</nav>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./app.js"></script>
</body>
</html>
