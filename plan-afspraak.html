<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Afspraak plannen - ZorgRapp</title>
  <link rel="stylesheet" href="app.css?v=156" />
</head>

<body>
  <main class="container">
    <header class="topbar">
      <div>
        <h1>ZorgRapp</h1>
        <p>Nieuwe afspraak plannen voor bestaande cliënt.</p>
        <a class="page-link" href="./new-client.html">← Terug naar cliënten</a>
      </div>
    </header>

 <section class="card">
  <h2>Afspraak plannen</h2>

  <div class="info-box">
    <strong>Cliënt</strong><br>
    <span id="clientName">Laden...</span><br>
    <span id="clientAddress"></span><br>
    <span id="clientPhone"></span>
  </div>

  <form id="appointmentForm" class="plan-form">
    <div class="section">
      <h3>Afspraakgegevens</h3>

      <label for="appointment_date">Datum</label>
      <input type="date" id="appointment_date" class="input" required />

      <label for="appointment_time">Tijd</label>
      <input type="time" id="appointment_time" class="input" required />

      <label for="service_type">Dienst</label>
<input
  type="text"
  id="service_type"
  class="input"
  required
  placeholder="Bijvoorbeeld: medicijnen, boodschappen, zorgafspraak..."
/>

      <label for="duration_minutes">Duur</label>
      <select id="duration_minutes" class="input" required>
        <option value="">Kies duur</option>
        <option value="30">30 minuten</option>
        <option value="60">60 minuten</option>
        <option value="90">90 minuten</option>
        <option value="120">120 minuten</option>
      </select>

      <label for="notes">Opmerking</label>
      <textarea
        id="notes"
        class="input"
        rows="4"
        placeholder="Bijvoorbeeld: ophalen, aandachtspunt, adresdetails..."
      ></textarea>
    </div>

 <div class="plan-actions">
    <button type="submit" class="btn btn-dark">
      Afspraak opslaan
    </button>

    <button
      type="button"
      class="btn btn-secondary"
      onclick="confirmLeave('./index.html')"
    >
      Terug naar dashboard
    </button>

    <button
      type="button"
      class="btn btn-secondary"
      onclick="confirmLeave('./maandrapportages.html')"
    >
      Terug naar maandrapportages
    </button>
  </div>

  <p id="saveMessage" class="save-message"></p>
</form>

  <div id="saveMessage" class="save-message"></div>
</div>
  </form>
</section>
 
</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./plan-afspraak.js?v=1"></script>
</body>
</html>
